name: Mobile prediction chart optimization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-prediction-chart-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Optimize prediction quality chart on mobile
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          path = Path('src/components/PredictionQualityChart.astro')
          text = path.read_text()

          old = '<div class="chart-shell scroll-frame-focus scroll-frame-quiet scroll-frame-clipped">'
          new = '<div class="chart-shell scroll-frame-focus scroll-frame-quiet scroll-frame-clipped" data-prediction-quality-chart>'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one prediction chart shell, found {text.count(old)}')
          text = text.replace(old, new)

          density_start = '      {density.map((bin) => {'
          if text.count(density_start) != 2:
              raise SystemExit(f'Expected two density maps, found {text.count(density_start)}')
          text = text.replace(density_start, '      <g class="density-layer">\n' + density_start, 1)

          parity_line = '      <line x1={x(0)} y1={y(0)} x2={x(axisMax)} y2={y(axisMax)} stroke="var(--chart-reference)" stroke-width="1.6" stroke-dasharray="7 7" opacity="0.70" />'
          if text.count(parity_line) != 1:
              raise SystemExit(f'Expected one parity line, found {text.count(parity_line)}')
          text = text.replace(parity_line, '      </g>\n\n' + parity_line)

          script = base64.b64decode('').decode()
          style_marker = '<style>\n  .chart-shell {'
          if text.count(style_marker) != 1:
              raise SystemExit(f'Expected one style marker, found {text.count(style_marker)}')
          text = text.replace(style_marker, script + style_marker)

          keyframes = base64.b64decode('ICBAa2V5ZnJhbWVzIGRlbnNpdHktaW4gewogICAgZnJvbSB7IG9wYWNpdHk6IDA7IHRyYW5zZm9ybTogdHJhbnNsYXRlWSgzcHgpOyB9CiAgfQoK').decode()
          if text.count(keyframes) != 1:
              raise SystemExit(f'Expected one density keyframe block, found {text.count(keyframes)}')

          mobile_css = base64.b64decode('').decode()
          text = text.replace(keyframes, keyframes + mobile_css)

          reduced_marker = base64.b64decode('ICBAbWVkaWEgKHByZWZlcnMtcmVkdWNlZC1tb3Rpb246IHJlZHVjZSkgewogICAgLmRlbnNpdHktY2VsbCB7CiAgICAgIGFuaW1hdGlvbjogbm9uZTsKICAgICAgdHJhbnNpdGlvbjogbm9uZTsKICAgIH0K').decode()
          reduced_replacement = base64.b64decode('').decode()
          if text.count(reduced_marker) != 1:
              raise SystemExit(f'Expected one reduced-motion block, found {text.count(reduced_marker)}')
          text = text.replace(reduced_marker, reduced_replacement)

          path.write_text(text)
          PY

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/mobile-prediction-chart-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PredictionQualityChart.astro .github/workflows/mobile-prediction-chart-patch.yml
          git commit -m "Optimize prediction quality chart on mobile"
          git push origin main
