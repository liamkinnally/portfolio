name: Mobile project copy contrast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-project-copy-contrast.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Brighten project body copy on mobile dark mode
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/pages/projects/nba-scoring-model.astro')
          text = page.read_text()

          replacements = [
              (
                  'class="mt-7 max-w-3xl text-lg leading-8 text-slate-300 sm:text-xl"',
                  'class="project-body-copy mt-7 max-w-3xl text-lg leading-8 text-slate-300 sm:text-xl"',
                  1,
              ),
              (
                  'class="space-y-5 text-lg leading-8 text-slate-300',
                  'class="project-body-copy space-y-5 text-lg leading-8 text-slate-300',
                  5,
              ),
              (
                  'class="mt-2 leading-7 text-slate-300"',
                  'class="project-body-copy mt-2 leading-7 text-slate-300"',
                  4,
              ),
              (
                  'class="mt-3 max-w-2xl leading-7 text-slate-300"',
                  'class="project-body-copy mt-3 max-w-2xl leading-7 text-slate-300"',
                  1,
              ),
          ]

          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {expected} occurrences of {old!r}, found {count}')
              text = text.replace(old, new)

          page.write_text(text)

          css = Path('src/styles/theme-overrides.css')
          styles = css.read_text()
          rule = """

@media (max-width: 639px) {
  html[data-theme='dark'] .project-page .project-body-copy {
    color: #e2e8f0;
  }
}
"""
          if '.project-page .project-body-copy' in styles:
              raise SystemExit('Mobile project copy contrast rule already exists')
          css.write_text(styles.rstrip() + rule)
          PY

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/mobile-project-copy-contrast.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/projects/nba-scoring-model.astro src/styles/theme-overrides.css .github/workflows/mobile-project-copy-contrast.yml
          git commit -m "Brighten mobile project body copy"
          git push origin main
