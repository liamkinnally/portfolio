name: Project hero spacing patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/project-hero-spacing-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Tighten mobile hero spacing and preserve pill timing
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          page = Path('src/pages/projects/nba-scoring-model.astro')
          text = page.read_text()
          old = base64.b64decode('PGFydGljbGUgY2xhc3M9InByb2plY3QtcGFnZSBjb250YWluZXItc2hlbGwgcHQtMzIgcGItMjQiPg==').decode()
          new = base64.b64decode('PGFydGljbGUgY2xhc3M9InByb2plY3QtcGFnZSBjb250YWluZXItc2hlbGwgcHQtMjggcGItMjQgc206cHQtMzIiPg==').decode()
          if text.count(old) != 1:
              raise SystemExit(f'Expected one project article padding target, found {text.count(old)}')
          page.write_text(text.replace(old, new))

          layout = Path('src/layouts/BaseLayout.astro')
          text = layout.read_text()
          old = base64.b64decode('ICAgICAgICAgICAgICBjb25zdCBkZWZlcnJlZFJlbGVhc2VMaW5lID0gdGFyZ2V0Lm1hdGNoZXMoJy5hdmFpbGFiaWxpdHktcGlsbC5pbnRlcmFjdGl2ZS1waWxsJykKICAgICAgICAgICAgICAgID8gdmlld3BvcnRUb3AgKyB2aWV3cG9ydEhlaWdodCAqIDAuMjIKICAgICAgICAgICAgICAgIDogcmVsZWFzZUxpbmU7Cg==').decode()
          new = base64.b64decode('').decode()
          if text.count(old) != 1:
              raise SystemExit(f'Expected one deferred release target, found {text.count(old)}')
          layout.write_text(text.replace(old, new))
          PY

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/project-hero-spacing-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/projects/nba-scoring-model.astro src/layouts/BaseLayout.astro .github/workflows/project-hero-spacing-patch.yml
          git commit -m "Tighten mobile project hero spacing"
          git push origin main
