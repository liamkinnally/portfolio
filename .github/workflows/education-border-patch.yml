name: Education border timing patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/education-border-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Align education frame exit with bottom coursework pill
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          path = Path('src/layouts/BaseLayout.astro')
          text = path.read_text()
          old = base64.b64decode('ICAgICAgICAgICAgICA6IGlzRWR1Y2F0aW9uRnJhbWUKICAgICAgICAgICAgICAgID8gdmlld3BvcnRUb3AgKyB2aWV3cG9ydEhlaWdodCAqIDAuNTIK').decode()
          new = base64.b64decode('').decode()
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one education release trigger, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/education-border-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/layouts/BaseLayout.astro .github/workflows/education-border-patch.yml
          git commit -m "Tune education card border exit timing"
          git push origin main
